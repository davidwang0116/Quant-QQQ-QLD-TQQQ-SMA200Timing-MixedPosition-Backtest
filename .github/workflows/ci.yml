name: CI

# Code quality gate: runs on pushes and pull requests only.
# The scheduled weekly backtest lives in weekly-backtest.yml, so a lint
# regression can never break (or spam e-mails from) the weekly report job.
on:
  push:
    branches: ["main", "dev"]
    paths-ignore: ["reports/**", "**.md", "**.pdf"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: "pip" }
      # Pinned so a new ruff/mypy release cannot suddenly fail CI with new rules.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check . --output-format=github
      - run: ruff format --check .
      - run: mypy strategies/ backtest/ data/ --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python-version }}", cache: "pip" }
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --cov=strategies --cov=backtest --cov=data --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with: { token: "${{ secrets.CODECOV_TOKEN }}", files: coverage.xml, fail_ci_if_error: false }
