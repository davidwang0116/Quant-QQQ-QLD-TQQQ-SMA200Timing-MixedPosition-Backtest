name: Weekly Backtest

# Refreshes market data every Monday and commits the updated reports/.
# Can also be started by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 2 * * 1" # Mon 02:17 UTC (off the top of the hour to avoid queue delays)
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default; the job must push the refreshed reports.
permissions:
  contents: write

concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    name: Weekly Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt

      - name: Sanity tests
        run: pytest tests/ -q

      # yfinance occasionally rate-limits / times out; retry before giving up.
      - name: Run backtest (with data refresh)
        run: |
          for attempt in 1 2 3; do
            python backtest/run.py --refresh && exit 0
            echo "::warning::Backtest attempt $attempt failed, retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Commit updated reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No report changes this week."
            exit 0
          fi
          git commit -m "chore: weekly backtest report $(date -u +%Y-%m-%d) [skip ci]"
          # Rebase in case main moved while the job was running.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Job summary
        if: always()
        run: |
          if [ -f reports/results.md ]; then
            cat reports/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
